name: Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk live-translator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: live-translator-apk
          path: live-translator.apk

      # After each merge on main, publish the APK as the latest GitHub Release.
      # The README links to releases/latest/download/live-translator.apk.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" live-translator.apk \
            --target "${{ github.sha }}" \
            --title "Live Translator #${{ github.run_number }}" \
            --notes "APK construit automatiquement après le merge de ${{ github.sha }}." \
            --latest
